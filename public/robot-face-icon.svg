<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#000000"/>
  <!-- Left Eye: Dark teal iris + cyan ring + pupil + gleam -->
  <circle cx="32" cy="44" r="14" fill="#04222c" stroke="#00f3ff" stroke-width="2.5"/>
  <circle cx="32" cy="44" r="6" fill="#000609"/>
  <circle cx="30" cy="42" r="2.2" fill="#ffffff"/>
  
  <!-- Right Eye: Dark teal iris + cyan ring + pupil + gleam -->
  <circle cx="68" cy="44" r="14" fill="#04222c" stroke="#00f3ff" stroke-width="2.5"/>
  <circle cx="68" cy="44" r="6" fill="#000609"/>
  <circle cx="66" cy="42" r="2.2" fill="#ffffff"/>

  <!-- Clean elegant smile -->
  <path d="M 43,66 C 43,74 57,74 57,66" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
