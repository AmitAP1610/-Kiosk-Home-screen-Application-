name: Build & Release Android APK (KIOSK AMR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm Packages
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 platforms;android-36 build-tools;34.0.0 build-tools;36.0.0'

      - name: Accept Android SDK Licenses & Configure Environment
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Copy Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          mkdir -p android/app/libs

      - name: Compile Android Debug APK
        run: |
          cd android
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log; then
            echo "::error title=Gradle Build Failure::Check log for compilation error"
            echo "========== COMPILER ERROR MATCHES =========="
            grep -i -C 2 "error:" ../build.log || true
            echo "========== LAST 70 LINES OF BUILD LOG =========="
            tail -n 70 ../build.log
            exit 1
          fi

      - name: Locate & Prepare APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/KIOSK-AMR-v1.0.0.apk
          mkdir -p dist-apk
          cp "$APK_PATH" dist-apk/KIOSK-AMR.apk
          mkdir -p public
          cp "$APK_PATH" public/KIOSK-AMR.apk
          ls -la release-apk/ dist-apk/ public/

      - name: Commit APK Directly into Repository (Bypasses Releases 504 CDN Timeout)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist-apk/KIOSK-AMR.apk public/KIOSK-AMR.apk
          git commit -m "chore(apk): publish pre-compiled APK binary directly to repo" || true
          git push origin main || true

      - name: Upload APK to Direct Fast Mirror
        run: |
          MIRROR_URL=$(curl -s -F "file=@release-apk/KIOSK-AMR-v1.0.0.apk" https://temp.sh/upload)
          echo "DIRECT_MIRROR_URL=$MIRROR_URL" >> $GITHUB_ENV
          echo "### 🚀 Direct Mirror Download Link" >> $GITHUB_STEP_SUMMARY
          echo "$MIRROR_URL" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIOSK-AMR-Android-Tablet-App
          path: release-apk/KIOSK-AMR-v1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: KIOSK AMR — Android APK Release (v1.0.0)
          body: |
            ## KIOSK AMR — Android Tablet Application (Release v1.0.0)

            Directly installable APK for Android tablets (optimized for 10-inch Realme Android tablet in landscape orientation).

            ### Fast Direct Mirrors (If GitHub Releases gives 504 Timeout):
            - Direct Git Raw: https://raw.githubusercontent.com/AmitAP1610/-Kiosk-Home-screen-Application-/main/dist-apk/KIOSK-AMR.apk
            - High-Speed jsDelivr CDN: https://cdn.jsdelivr.net/gh/AmitAP1610/-Kiosk-Home-screen-Application-@main/dist-apk/KIOSK-AMR.apk
            - Temporary Fast Mirror: ${{ env.DIRECT_MIRROR_URL }}

            ### How to Install on your Tablet:
            1. Download the APK using any link above directly onto your Android tablet.
            2. Tap the downloaded file in your browser's Downloads or Files app.
            3. Tap **Install** (if prompted, enable "Allow installation from this source").
            4. Tap **Open** — KIOSK AMR will launch in fullscreen landscape mode!
          files: |
            release-apk/KIOSK-AMR-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
