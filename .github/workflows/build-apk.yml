name: Build & Release Android APK (KIOSK AMR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm Packages
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Copy Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Sharing & Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KIOSK-AMR-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIOSK-AMR-Android-Tablet-App
          path: android/app/build/outputs/apk/debug/KIOSK-AMR-v1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: KIOSK AMR — Android APK Release (v1.0.0)
          body: |
            ## KIOSK AMR — Android Tablet Application (Release v1.0.0)

            Directly installable APK for Android tablets (optimized for 10-inch Realme Android tablet in landscape orientation).

            ### Features:
            - **Fullscreen Kiosk Mode:** Automatic sticky immersive mode hides system bars.
            - **Screen Keep-Alive:** Prevents the tablet display from sleeping while running.
            - **Native Voice & Audio:** Authorizes Speech Synthesis and Speech-to-Text.
            - **Offline Capable:** All photographs, campus data, and robot controls run locally.

            ### How to Install:
            1. Download `KIOSK-AMR-v1.0.0.apk` below directly onto your Android tablet.
            2. Tap the downloaded file to install (allow "Install unknown apps" if prompted).
            3. Open **KIOSK AMR** — it opens in fullscreen landscape!
          files: |
            android/app/build/outputs/apk/debug/KIOSK-AMR-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
