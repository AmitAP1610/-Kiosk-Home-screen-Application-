name: Build & Release Android APK (KIOSK AMR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm Packages
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 platforms;android-36 build-tools;34.0.0'

      - name: Accept Android SDK Licenses & Configure Environment
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Copy Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          mkdir -p android/app/libs
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs

      - name: Compile Android Debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log || {
            ERR_MSG=$(tail -n 25 ../gradle.log | tr '\n' ' ' | sed 's/[^a-zA-Z0-9 :.,_\/-]//g')
            echo "::error title=Gradle Error::$ERR_MSG"
            exit 1
          }

      - name: Locate & Prepare APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/KIOSK-AMR-v1.0.0.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIOSK-AMR-Android-Tablet-App
          path: release-apk/KIOSK-AMR-v1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: KIOSK AMR — Android APK Release (v1.0.0)
          body: |
            ## KIOSK AMR — Android Tablet Application (Release v1.0.0)

            Directly installable APK for Android tablets (optimized for 10-inch Realme Android tablet in landscape orientation).

            ### Features:
            - **Fullscreen Kiosk Mode:** Automatic sticky immersive mode hides system navigation bars and status bar.
            - **Screen Keep-Alive:** Prevents the tablet display from sleeping while running.
            - **Native Voice & Audio:** Authorizes Speech Synthesis and Speech-to-Text.
            - **Offline Capable:** All photographs, campus data, and robot controls run locally without requiring internet.

            ### How to Install on your Tablet:
            1. Download `KIOSK-AMR-v1.0.0.apk` below directly onto your Android tablet.
            2. Tap the downloaded file in your browser's Downloads or Files app.
            3. Tap **Install** (if prompted, enable "Allow installation from this source").
            4. Tap **Open** — KIOSK AMR will launch in fullscreen landscape mode!
          files: |
            release-apk/KIOSK-AMR-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
