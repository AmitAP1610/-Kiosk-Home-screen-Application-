name: Build & Release Android APK (KIOSK AMR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm Packages
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses & Configure Environment
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Copy Web Assets to Android Project
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          rm -f android/app/src/main/assets/public/*.apk
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          mkdir -p android/app/libs

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error title=Gradle Build Failure::Gradle exited with code $GRADLE_EXIT"
            echo "### ❌ Gradle Build Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 ../gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradle_build.log
            git commit -m "build-log: failure details" || true
            git push origin main || true
            exit $GRADLE_EXIT
          fi

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore

      - name: Locate & Prepare APK
        run: |
          mkdir -p release-apk
          echo "=== ALL APKS CREATED ==="
          find android -name "*.apk" || true
          echo "=== ALL BUILD OUTPUTS ==="
          find android/app/build/outputs -type f || true

          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH=$(find android/app/build/outputs -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error title=Gradle Build Error::No APK was compiled!"
            exit 1
          fi
          echo "Real newly compiled APK found at: $APK_PATH"
          ls -lh "$APK_PATH"
          cp "$APK_PATH" release-apk/KIOSK-AMR-v1.0.3.apk
          mkdir -p dist-apk
          cp "$APK_PATH" dist-apk/KIOSK-AMR.apk
          cp "$APK_PATH" dist-apk/KIOSK-AMR-v1.0.3.apk
          mkdir -p public
          cp "$APK_PATH" public/KIOSK-AMR.apk
          cp "$APK_PATH" public/KIOSK-AMR-v1.0.3.apk
          ls -la release-apk/ dist-apk/ public/

      - name: Commit APK Directly into Repository (Bypasses Releases 504 CDN Timeout)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist-apk/ public/
          git commit -m "chore(apk): publish pre-compiled APK v1.0.3 directly to repo" || true
          git push origin main || true

      - name: Upload APK to Direct Fast Mirror
        run: |
          MIRROR_URL=$(curl -s -F "file=@release-apk/KIOSK-AMR-v1.0.3.apk" https://temp.sh/upload)
          echo "DIRECT_MIRROR_URL=$MIRROR_URL" >> $GITHUB_ENV
          echo "### 🚀 Direct Mirror Download Link" >> $GITHUB_STEP_SUMMARY
          echo "$MIRROR_URL" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIOSK-AMR-Android-Tablet-App-v1.0.3
          path: release-apk/KIOSK-AMR-v1.0.3.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3-apk
          name: KIOSK AMR — Android APK Release (v1.0.3)
          overwrite: true
          make_latest: true
          body: |
            ## KIOSK AMR — Android Tablet Application (Release v1.0.3)

            Fresh verified compilation from source:
            - Guaranteed Gradle debug build output
            - versionCode 3 (forces Android upgrade and clears stale cache)
            - WebView cache-busting enabled
            - Robot face stays until explicitly touched
            - Gallery and minimize/maximize removed
            - Full Jetson teleoperation & 2D SLAM mapping
          files: |
            release-apk/KIOSK-AMR-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
